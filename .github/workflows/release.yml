name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest
    permissions:
      contents: write
    environment:
      name: production

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.6,<7"
      - name: Verify version matches tag
        shell: pwsh
        run: |
          $version = python -c "from irbis_control import __version__; print(__version__)"
          $releaseTag = "${{ github.ref_name }}"
          $tagVersion = $releaseTag -replace '^v', ''
          if ($version -ne $tagVersion) {
            throw "Tag $releaseTag does not match application version $version"
          }
      - name: Check release tag belongs to main
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${{ github.sha }}" origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag must point to a commit reachable from main"
          }
      - name: Build Windows executables
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name IRBIS64Control --icon assets/icons/irbis64_control.ico `
            --add-data "assets;assets" main.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name IRBIS64ControlDB --icon assets/icons/irbis64_control.ico `
            --add-data "assets;assets" db_connector.py
          Rename-Item -LiteralPath dist/IRBIS64Control.exe -NewName "ИРБИС64 Контроль.exe"
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup compiler was not found"
          }
          $version = python -c "from irbis_control import __version__; print(__version__)"
          & $iscc "/DMyAppVersion=$version" "installer\IRBIS64Control.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
      - name: Package portable build and checksums
        shell: pwsh
        run: |
          $version = python -c "from irbis_control import __version__; print(__version__)"
          $installer = "dist/IRBIS64Control-Installer-v$version-Windows-x64.exe"
          Compress-Archive `
            -LiteralPath "dist/ИРБИС64 Контроль.exe", "dist/IRBIS64ControlDB.exe" `
            -DestinationPath "dist/IRBIS64Control-windows-x64.zip"
          Get-FileHash -Algorithm SHA256 `
            $installer, `
            "dist/IRBIS64Control-windows-x64.zip" |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content -Encoding ascii "dist/SHA256SUMS.txt"
      - name: Prepare release notes
        shell: pwsh
        run: |
          $version = python -c "from irbis_control import __version__; print(__version__)"
          @"
          ## ИРБИС64 Контроль v$version

          Первый публичный релиз «ИРБИС64 Контроль» — настольного помощника для проверки библиотечных записей ИРБИС64 по перечням и реестрам, подготовки отчётов и безопасного внесения служебных меток.

          ### Что умеет версия $version

          - подключаться к серверу ИРБИС64 или работать с выгрузкой базы в TXT;
          - получать актуальные перечни НКП РГБ и использовать локальные Excel-таблицы;
          - искать совпадения по ISBN, названию, автору, издательству и году;
          - разделять уверенные и неоднозначные совпадения и передавать спорные случаи на ручную проверку;
          - формировать Excel-отчёты с результатами проверки;
          - безопасно добавлять служебные метки в записи ИРБИС64;
          - создавать изменённую TXT-копию базы без перезаписи исходного файла;
          - сохранять журнал действий и резервные данные для восстановления.

          ### Файлы релиза

          **IRBIS64Control-Installer-v$version-Windows-x64.exe** — установщик для 64-разрядной Windows. В имени указаны тип файла, версия программы и целевая система.

          **IRBIS64Control-windows-x64.zip** — переносная сборка для запуска без установки.

          **SHA256SUMS.txt** — контрольные суммы SHA-256 для проверки целостности скачанных файлов.

          ### Перед началом работы

          Перед массовым изменением рабочей базы рекомендуется сначала проверить небольшую выборку записей, просмотреть подготовленные изменения и сохранить резервную копию. Программа повторно проверяет записи перед записью, чтобы снизить риск перезаписи изменений, сделанных другим пользователем.

          Сборка предназначена для 64-разрядной Windows. Исходный код распространяется по лицензии MIT.
          "@ | Set-Content -Encoding utf8 "release-notes.md"
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from irbis_control import __version__; print(__version__)"
          $releaseTag = "${{ github.ref_name }}"
          $installer = "dist/IRBIS64Control-Installer-v$version-Windows-x64.exe"
          $assets = @(
            $installer,
            "dist/IRBIS64Control-windows-x64.zip",
            "dist/SHA256SUMS.txt"
          )
          gh release view $releaseTag 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $releaseTag already exists and will not be modified"
          }
          gh release create $releaseTag $assets `
            --verify-tag `
            --title "ИРБИС64 Контроль $releaseTag" `
            --notes-file "release-notes.md"
