name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.6,<7"
      - name: Verify version matches tag
        shell: pwsh
        run: |
          $version = python -c "from irbis_control import __version__; print(__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match application version v$version"
          }
      - name: Build Windows executables
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name IRBIS64Control --icon assets/irbis64_control.ico `
            --add-data "assets;assets" main.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name IRBIS64ControlDB --icon assets/irbis64_control.ico `
            --add-data "assets;assets" db_connector.py
          Rename-Item -LiteralPath dist/IRBIS64Control.exe -NewName "ИРБИС64 Контроль.exe"
          Compress-Archive `
            -LiteralPath "dist/ИРБИС64 Контроль.exe", "dist/IRBIS64ControlDB.exe" `
            -DestinationPath "dist/IRBIS64Control-windows-x64.zip"
          Get-FileHash -Algorithm SHA256 "dist/IRBIS64Control-windows-x64.zip" |
            ForEach-Object { "$($_.Hash.ToLower())  IRBIS64Control-windows-x64.zip" } |
            Set-Content -Encoding ascii "dist/SHA256SUMS.txt"
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/IRBIS64Control-windows-x64.zip" `
            "dist/SHA256SUMS.txt" `
            --title "ИРБИС64 Контроль ${{ github.ref_name }}" `
            --generate-notes
