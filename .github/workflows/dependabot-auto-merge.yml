name: Dependabot auto-merge (disabled)

# Keep Dependabot updates subject to branch protection and manual review.
# To re-enable auto-merging, implement a separate reviewed policy change.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice:
    name: Manual merge required
    runs-on: ubuntu-latest
    steps:
      - run: echo "Automatic Dependabot merging is disabled; review and squash-merge PRs manually."
